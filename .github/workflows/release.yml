name: Release

# Builds, signs (Developer ID), notarizes, and staples Relvora, then attaches it to the GitHub release.
# Set up the secrets first: docs/DISTRIBUTION.md. Without them the job still builds an unsigned test package
# (uploaded as a workflow artifact only, never attached to a release).
on:
  # Publishing a release on GitHub (for example, a draft Relvora created) attaches the notarized app to it.
  release:
    types: [published]
  # A manual build of any version, uploaded as a workflow artifact.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.2.0"
        required: true
  # Pull requests that change the release pipeline get an unsigned dry run.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release/**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build, sign, and notarize (macOS 26)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Secrets can't be tested in `if:` directly; these only say whether they are set.
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' && secrets.DEVELOPMENT_TEAM != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            release) version="${TAG#v}" ;;
            workflow_dispatch) version="${INPUT#v}" ;;
            *) version="0.0.0-pr${{ github.event.number }}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" \
            || { echo "::error::The certificate isn't a Developer ID Application certificate"; exit 1; }

      - name: Notary API key
        if: env.HAS_NOTARY == 'true' && env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          echo "$P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING: ${{ env.HAS_SIGNING == 'true' && github.event_name != 'pull_request' && 'developer-id' || 'adhoc' }}
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: scripts/release/build-release.sh

      - name: Summary
        env:
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          {
            echo "### Relvora ${{ steps.version.outputs.version }}"
            echo
            echo "- Package: \`$(basename "$ZIP")\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$ZIP.sha256")\`"
            if [[ "$ZIP" == *-unsigned.zip ]]; then
              echo "- ⚠️ **Unsigned test package.** Set up the signing secrets (docs/DISTRIBUTION.md) to build a notarized app."
            elif [[ -z "${NOTARY_KEY_PATH:-}" ]]; then
              echo "- ⚠️ Signed with Developer ID but **not notarized** (no notary key)."
            else
              echo "- Signed with Developer ID, notarized, and stapled."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Relvora-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.zip }}.sha256
          retention-days: 30

      # Only a signed and notarized build is attached to a release.
      - name: Attach to the GitHub release
        if: github.event_name == 'release' && env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
